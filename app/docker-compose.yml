services:
  postgres:
    image: postgres:16.15-bookworm
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - examguard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: examguard-backend:local
    build:
      context: ./backend
      args:
        UV_VERSION: 0.12.5
        TORCH_FLAVOR: cpu
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PROFILE: ${APP_PROFILE:-gtx1650}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}@postgres:5432/${POSTGRES_DB}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      UPLOAD_ROOT: /data/uploads
      EVIDENCE_ROOT: /data/evidence
      MODEL_ROOT: /models
      CONFIG_ROOT: /app/configs
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-4294967296}
      FFPROBE_TIMEOUT_SECONDS: ${FFPROBE_TIMEOUT_SECONDS:-30}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-}
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/data
      - ./model_artifacts:/models:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://localhost:8000/api/v1/health
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    image: examguard-frontend:local
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  examguard_postgres_data:
    name: examguard_postgres_data

profile: rtx3060

runtime:
  device: cuda:0
  precision: fp16

analysis:
  target_fps: 18.0
  minimum_fps: 12.0
  queue_size: 1
  drop_stale_frames: true

detector:
  model: /models/detection/yolo11n.pt
  imgsz: 640
  conf: 0.10
  iou: 0.50
  classes: [0]
  max_det: 32
  half: true
  duplicate_suppression:
    enabled: true
    containment_threshold: 0.90
    max_area_ratio: 0.70
    max_center_distance_ratio: 0.35
    preferred_detection_confidence: 0.25
    larger_box_min_confidence_ratio: 0.65

tracker:
  config: /app/configs/tracking/bytetrack_exam_3060.yaml

diagnostics:
  publish_hz: 2

identity:
  mode: logical_track

logical_tracking:
  center_history_size: 6
  raw_track_history_size: 8
  recovery:
    max_lost_ms: 5500
    max_position_distance: 0.18
    min_scale_similarity: 0.40
    min_score: 0.55
    ambiguity_margin: 0.08
    position_weight: 0.55
    motion_weight: 0.25
    scale_weight: 0.20

reid:
  enabled: false  # EXP-TRACK-B remains opt-in until this hardware is benchmarked
  mode: on_demand
  encoder: hsv_histogram_v1
  max_batch_size: 16
  min_similarity: 0.72
  appearance_weight: 0.45
  min_combined_score: 0.68
  ambiguity_margin: 0.06
  prototype_alpha: 0.20
  prototype_seed_delay_ms: 800
  min_prototype_confidence: 0.50
  max_request_age_ms: 250

dynamic_neighbors:
  enabled: true
  max_neighbors_per_actor: 2
  max_horizontal_gap_ratio: 2.5
  max_vertical_gap_ratio: 0.75
  min_scale_similarity: 0.40

seat_assignment:
  enabled: true
  overlap_weight: 0.70
  distance_weight: 0.30
  min_score: 0.35
  seat_expand_ratio: 0.08
  confirm_ms: 600
  release_ms: 1500
  switch_margin: 0.15
  switch_confirm_ms: 800

action_recognition:
  enabled: false  # RTX3060 scheduling/precision remains unbenchmarked
  model: /models/action/r3/model.pth
  checkpoint_sha256: c5ef406cfe404d2883575d8dcf1306fd7bebc6d6b1ec723b5093f2a3e09b357c
  architecture: TSM-ResNet50
  num_segments: 8
  input_size: 224
  clip_span_ms: 4000
  capture_interval_ms: 160
  sample_tolerance_ms: 140
  max_gap_ms: 750
  precision: fp16
  scheduling:
    prediction_stride_ms: 1000
    max_batch_size: 4
    max_queue_size: 1
    max_prediction_age_ms: 2000
    min_inference_interval_ms: 160
  single_roi:
    expand_x: 0.04
    expand_top: 0.03
    expand_bottom: 0.08
    min_crop_width_px: 128
    min_crop_height_px: 128
  pair_roi:
    expand_x: 0.025
    expand_top: 0.02
    expand_bottom: 0.06
    min_crop_width_px: 128
    min_crop_height_px: 128
  adjacency:
    row_tolerance_ratio: 0.75
    max_horizontal_gap_ratio: 2.5

# GTX1650 pilot calibration failed the event-accuracy gate. This profile also
# lacks an RTX3060 production-path performance/calibration run; keep disabled.
event_detection:
  enabled: false
  max_discontinuity_ms: 5000
  dedup_temporal_iou: 0.30
  dedup_max_gap_ms: 2000

# Per-actor X3D-L classifier of cheating_detection_v1 (4 classes). Runs on the Stable Actor tracks above;
# alerts of actors resolved to a SessionCandidate (seat layout + assignment) become PENDING_REVIEW Events.
# RTX3060: one window of 6 actors every second, 245 ms compiled / 305 ms eager (docs/X3D_INTEGRATION.md).
cheating_classifier:
  enabled: true
  model: /models/cheating/x3d_l_v1_best.pt
  sample_interval_ms: 200
  infer_interval_ms: 1000
  min_coverage: 0.75
  clip_size: 356
  crop_pad: 0.15
  box_map: {dx1: -0.101, dx2: 0.094, dy1: -0.131, h: 1.021}
  batch_size: 8
  compile: true
  max_actor_gap_ms: 5000
  rule:
    smooth_windows: 3
    start_threshold: 0.85
    keep_threshold: 0.70
    min_windows: 2

tracking_debug:
  enabled: false
  log_every_n_frames: 10
  suspicious_iou_threshold: 0.50

ui:
  tracking_interpolation: false
  tracking_smoothing: false
